[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "hackalem-wind-forecast"
version = "0.1.0"
description = "Hourly wind-power forecasts using archived weather forecasts"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3", "pandas>=2.2,<4", "scikit-learn>=1.4,<2",
  "xgboost>=2.1,<4", "joblib>=1.3,<2", "matplotlib>=3.8,<4", "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pypdf>=5,<7"]

[project.scripts]
wind-forecast = "wind_forecast.cli:main"

[tool.setuptools.packages.find]
include = ["wind_forecast*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
