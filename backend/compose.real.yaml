services:
  backend:
    depends_on:
      - ml
    environment:
      AGENT_MODE: http
      ALLOW_FIXTURES: "false"
      PYTHON_BASE_URL: http://ml:8000
      PYTHON_INTERNAL_TOKEN: "${PYTHON_INTERNAL_TOKEN:-}"
  ml:
    build:
      context: ../ml
    environment:
      ML_HTTP_ADDR: ":8000"
      ML_INTERNAL_TOKEN: "${PYTHON_INTERNAL_TOKEN:-}"
    volumes:
      - ../ml/artifacts:/app/artifacts:ro
      - ../ml/data:/app/data:ro
