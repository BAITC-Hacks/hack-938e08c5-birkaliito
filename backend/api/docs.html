<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Wind API contract</title>
<style>body{font:16px system-ui;max-width:1100px;margin:40px auto;padding:0 20px;background:#111827;color:#e5e7eb}a{color:#7dd3fc}summary{cursor:pointer;padding:12px}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1f2937;padding:16px}details{border-bottom:1px solid #374151}h1{color:#fff}</style>
<h1>Wind Forecast API</h1><p>Offline viewer of the <a href="/openapi.yaml">canonical OpenAPI 3.1</a>. JSON representation is valid YAML 1.2. Synthetic results always carry data_mode=fixture.</p><main id="main">Loading local contract…</main>
<script>fetch('/openapi.yaml').then(r=>{if(!r.ok)throw Error('Contract unavailable');return r.json()}).then(s=>{let m=document.getElementById('main');m.textContent='';let p=document.createElement('p');p.textContent=s.info.description;m.append(p);for(let [path,ops]of Object.entries(s.paths)){for(let [method,op]of Object.entries(ops)){let d=document.createElement('details'),h=document.createElement('summary'),b=document.createElement('pre');h.textContent=method.toUpperCase()+' '+path;b.textContent=JSON.stringify(op,null,2);d.append(h,b);m.append(d)}}let h=document.createElement('h2');h.textContent='Schemas';m.append(h);for(let [name,schema]of Object.entries(s.components.schemas)){let d=document.createElement('details'),h=document.createElement('summary'),b=document.createElement('pre');h.textContent=name;b.textContent=JSON.stringify(schema,null,2);d.append(h,b);m.append(d)}}).catch(e=>document.getElementById('main').textContent=e.message)</script></html>
