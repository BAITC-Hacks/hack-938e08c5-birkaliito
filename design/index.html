<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0c0d">
  <title>AURA — Wind Intelligence</title>
  <link rel="stylesheet" href="styles.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <a class="skip-link" href="#main">К содержимому</a>
  <aside class="rail" aria-label="Быстрый доступ">
    <a href="#forecast" class="symbol" aria-label="AURA — прогноз"><span data-icon="wind"></span></a>
    <nav>
      <a href="#forecast" data-page="forecast" aria-label="Прогноз" title="Прогноз"><span data-icon="grid"></span></a>
      <a href="#analytics" data-page="analytics" aria-label="Аналитика" title="Аналитика"><span data-icon="chart"></span></a>
      <a href="#history" data-page="history" aria-label="История" title="История"><span data-icon="clock"></span></a>
      <a href="#replay" data-page="replay" aria-label="Replay" title="Replay"><span data-icon="repeat"></span></a>
      <a href="#quality" data-page="quality" aria-label="Качество" title="Качество"><span data-icon="shield"></span></a>
      <a href="#agent" data-page="agent" aria-label="Агент и источники" title="Агент и источники"><span data-icon="spark"></span></a>
      <a href="#data" data-page="data" aria-label="Исходные данные" title="Исходные данные"><span data-icon="database"></span></a>
    </nav>
    <button class="icon-button rail-help" data-action="help" aria-label="Как читать прогноз"><span data-icon="help"></span></button>
    <div class="avatar" title="Дизайн-прототип">A</div>
  </aside>
  <div class="shell">
    <header class="topbar">
      <a class="wordmark" href="#forecast">aura<span>®</span><small>WIND INTELLIGENCE</small></a>
      <nav class="top-tabs" aria-label="Основная навигация">
        <a href="#forecast" data-page="forecast">Прогноз</a>
        <a href="#analytics" data-page="analytics">Аналитика</a>
        <a href="#history" data-page="history">История</a>
        <a href="#replay" data-page="replay">Replay</a>
        <a href="#quality" data-page="quality">Качество</a>
      </nav>
      <a href="#agent" class="source-chip"><i></i><span>Источники</span><span data-icon="arrow"></span></a>
    </header>
    <div class="fixture-banner"><span data-icon="info"></span><span>Синтетические данные — режим разработки</span><button data-action="prototype-info">Что уже подключено? <span data-icon="arrow"></span></button></div>
    <main id="main" tabindex="-1"></main>
    <footer><span>AURA / WIND INTELLIGENCE <b>2026</b></span><span>Asia/Almaty · часовой пояс исходного CSV не подтверждён</span></footer>
  </div>
  <nav class="bottom-nav" aria-label="Мобильная навигация">
    <a href="#forecast" data-page="forecast"><span data-icon="grid"></span>Прогноз</a>
    <a href="#analytics" data-page="analytics"><span data-icon="chart"></span>Аналитика</a>
    <a href="#history" data-page="history"><span data-icon="clock"></span>История</a>
    <button data-action="more"><span data-icon="menu"></span>Ещё</button>
  </nav>
  <dialog id="modal" aria-labelledby="modal-title"><div class="modal-heading"><div><p class="eyebrow" id="modal-kicker">AURA / ДЕТАЛИ</p><h2 id="modal-title"></h2></div><button class="icon-button" data-action="close" aria-label="Закрыть окно"><span data-icon="close"></span></button></div><div id="modal-body"></div></dialog>
  <div class="toast" role="status" aria-live="polite" id="toast"></div>
</body>
</html>
